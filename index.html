<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#72d7ed"><title>Flap — 16-bit Flight</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72d7ed;touch-action:manipulation;font-family:ui-monospace,monospace}#stage{position:fixed;inset:0;width:100vw;height:100dvh}canvas{width:100%;height:100%;display:block;image-rendering:auto}#hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-weight:bold;text-shadow:2px 3px #42617b}#score{position:absolute;top:18px;left:24px;font-size:clamp(24px,4vw,42px)}#best{position:absolute;top:22px;right:24px;font-size:clamp(13px,2vw,20px)}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;text-shadow:3px 3px #76502e;background:#102c421c}.panel{padding:clamp(18px,4vw,36px);background:#286b83dd;border:4px solid #fff;box-shadow:6px 6px #36546b;max-width:90%}h1{font-size:clamp(36px,8vw,72px);margin:0 0 12px;letter-spacing:3px}p{font-size:clamp(14px,2.3vw,22px);line-height:1.5;margin:8px 0}.hint{font-size:clamp(11px,1.6vw,16px);margin-top:20px}#tap{position:absolute;inset:0;touch-action:manipulation}
</style></head><body><div id="stage"><canvas id="game"></canvas><div id="hud"><div id="score">0</div><div id="best">BEST 0</div></div><div id="overlay"><div class="panel"><h1>FLAP!</h1><p>Tap or press SPACE to flap.<br>Fly through the pipes!</p><p class="hint">TAP / CLICK / SPACE TO START</p></div></div><div id="tap"></div></div>
<script>(()=>{const c=document.querySelector('canvas'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),tap=document.getElementById('tap');let W=960,H=540,dpr=1,state='ready',bird,pipes,score=0,best=+(localStorage.flapBest||0),tick=0,last=0,clouds=[100,420,760,1100];const ground=58,pw=128,gap=300;
function resize(){dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);W=c.width;H=c.height}addEventListener('resize',resize);resize();
function reset(){bird={x:W*.28,y:H*.46,vy:0,rot:0};pipes=[];score=0;tick=0;addPipe(W+100);scoreEl.textContent='0'}function addPipe(x){const top=H*.17+Math.random()*H*.32;pipes.push({x,top,passed:false})}
function show(title,msg,hint){overlay.innerHTML='<div class="panel"><h1>'+title+'</h1><p>'+msg+'</p><p class="hint">'+hint+'</p></div>';overlay.style.display='flex'}function begin(){if(state==='over')reset();state='play';overlay.style.display='none';flap()}function flap(){if(state==='ready'||state==='over'){begin();return}if(state==='play')bird.vy=-H*.55}function act(){if(state!=='play'){begin()}else flap()}tap.addEventListener('pointerdown',e=>{e.preventDefault();act()});addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)act()}});function r(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function background(){
let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#3759a8');sky.addColorStop(.42,'#f18ca4');sky.addColorStop(.72,'#ffd49b');sky.addColorStop(1,'#ffedbd');r(0,0,W,H,sky);
// glowing sunset
ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(W*.78,H*.22,H*.09,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd78c';ctx.beginPath();ctx.arc(W*.78,H*.22,H*.065,0,Math.PI*2);ctx.fill();
// pixel cloud streaks drifting slowly
for(let i=0;i<5;i++){let x=((i*W*.29-tick*.12)%(W+180)+W+180)%(W+180)-90;let y=H*(.15+i%3*.12);r(x,y,110,13,'#fff0e4a8');r(x+20,y-12,55,13,'#fff0e4a8');r(x+75,y+8,45,9,'#fff0e4a8')}
// Three deliberately distinct Manhattan parallax layers:
// 1) far: soft, low, tightly packed rooftops; 2) mid: tall iconic towers;
// 3) near: chunky dark street-front blocks with bold silhouettes.
// Distant low-rise skyline
let farStep=47,farOffset=(tick*.13)%farStep;
for(let i=-2;i<W/farStep+3;i++){
 let x=i*farStep-farOffset,seed=((i*13+41)%9+9)%9,w=34+(seed%3)*5,h=H*(.09+seed*.013),y=H*.77-h;
 let col=['#b28ca9','#a982a4','#bd91a7'][seed%3];
 r(x,y,w,h,col);
 if(seed%3===0)r(x+w*.35,y-8,w*.3,8,col);
 for(let wy=y+14;wy<H*.76;wy+=24)for(let wx=x+7;wx<x+w-4;wx+=13)r(wx,wy,4,6,'#f6d5bd');
}
// Midground: separated tall skyscrapers with varied silhouettes and spires
let midStep=108,midOffset=(tick*.39)%midStep;
for(let i=-2;i<W/midStep+3;i++){
 let x=i*midStep-midOffset,seed=((i*7+19)%7+7)%7,w=66+(seed%2)*10,h=H*(.25+seed*.035),y=H*.85-h;
 let col=['#777ba5','#68799e','#84759e','#647f9e'][seed%4];
 r(x,y,w,h,col);
 if(seed===0){r(x+w*.18,y-22,w*.64,22,col);r(x+w*.32,y-45,w*.36,23,col);r(x+w*.47,y-78,5,33,'#d5b4c2');r(x+w*.49,y-98,2,20,'#d5b4c2')}
 else if(seed===3){r(x+w*.25,y-19,w*.5,19,col);r(x+w*.39,y-38,w*.22,19,col);r(x+w*.48,y-68,4,30,'#d5b4c2')}
 else if(seed===5){r(x+w*.12,y-13,w*.76,13,col);r(x+w*.28,y-27,w*.44,14,col);r(x+w*.46,y-49,5,22,'#d5b4c2')}
 else {r(x+9,y-12,w-18,12,col)}
 for(let wy=y+16;wy<H*.84;wy+=20)for(let wx=x+9;wx<x+w-6;wx+=15)r(wx,wy,6,9,'#ffe0a0');
}
// Foreground: broad, dark, irregular building masses, few large windows
let nearStep=154,nearOffset=(tick*.78)%nearStep;
for(let i=-2;i<W/nearStep+3;i++){
 let x=i*nearStep-nearOffset,seed=((i*11+23)%6+6)%6,w=116+(seed%2)*20,h=H*(.14+seed*.025),y=H*.89-h,col=['#2d456d','#35496f','#293e65'][seed%3];
 r(x,y,w,h,col);
 if(seed===0){r(x+w*.16,y-18,w*.68,18,col);r(x+w*.32,y-35,w*.36,17,col);r(x+w*.47,y-58,5,23,'#bba3bd')}
 else if(seed===2){r(x+w*.3,y-24,w*.4,24,col);r(x+w*.46,y-44,5,20,'#bba3bd')}
 else if(seed===4){r(x+w*.08,y-12,w*.84,12,col);r(x+w*.4,y-29,w*.2,17,col)}
 for(let wy=y+17;wy<H*.88;wy+=24)for(let wx=x+14;wx<x+w-10;wx+=25)r(wx,wy,10,11,'#eebd78');
}
 // foreground street base and scrolling pavement
r(0,H-ground,W,ground,'#b8a0a0');r(0,H-ground,W,12,'#f4ce8a');r(0,H-ground+12,W,7,'#796b85');for(let x=-(tick*1.6%54);x<W;x+=54){r(x,H-ground+27,28,5,'#e8c5a0');r(x+31,H-ground+42,18,5,'#8e7e91')}
}
function pipe(p){let bot=p.top+gap;let grad=ctx.createLinearGradient(p.x,0,p.x+pw,0);grad.addColorStop(0,'#16864c');grad.addColorStop(.22,'#45d66a');grad.addColorStop(.55,'#8af078');grad.addColorStop(1,'#237d42');r(p.x,0,pw,p.top-20,grad);r(p.x-10,p.top-20,pw+20,20,'#69ed77');r(p.x-10,p.top-20,pw+20,6,'#b0ff8d');r(p.x+15,0,12,p.top-20,'#a5ff9b');r(p.x+pw-18,0,8,p.top-20,'#146d3b');r(p.x,bot+20,pw,H-ground-bot-20,grad);r(p.x-10,bot,pw+20,20,'#69ed77');r(p.x-10,bot,pw+20,6,'#b0ff8d');r(p.x+15,bot+20,12,H-ground-bot-20,'#a5ff9b');r(p.x+pw-18,bot+20,8,H-ground-bot-20,'#146d3b');}
function birdDraw(){let x=bird.x,y=bird.y;ctx.save();ctx.translate(x,y);ctx.scale(2.58,2.58);ctx.rotate(bird.rot); // crisp 16-bit sprite shapes
r(-23,-15,36,29,'#f7bd2f');r(-14,-23,22,10,'#ffd95a');r(-17,7,20,11,'#d98a27');r(-19,-8,13,15,'#fff3b7');r(-21,-15,32,5,'#ffe67b');r(5,-10,10,10,'#fff');r(9,-8,5,5,'#20354b');r(12,-2,22,10,'#ff8b37');r(20,3,16,5,'#e34d35');r(-10,1,16,10,'#e7a83c');r(-18,14,15,4,'#b46c25');ctx.restore()}
function die(){if(state!=='play')return;state='over';best=Math.max(best,score);localStorage.flapBest=best;bestEl.textContent='BEST '+best;show('GAME OVER','Score '+score+' · Best '+best,'TAP / CLICK / SPACE TO RETRY')}
function update(dt){if(state!=='play')return;tick+=dt*60;bird.vy+=H*1.45*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.5,Math.min(1,bird.vy/(H*.95)));let speed=W*.19;for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+pw<bird.x){p.passed=true;score++;scoreEl.textContent=score}}if(pipes[0]?.x+pw<0)pipes.shift();if(!pipes.length||pipes[pipes.length-1].x<W*.66)addPipe(W+30);if(bird.y+40>H-ground||bird.y-40<0)die();for(const p of pipes)if(bird.x+43>p.x&&bird.x-43<p.x+pw&&(bird.y-36<p.top||bird.y+36>p.top+gap))die()}
function draw(){ctx.setTransform(1,0,0,1,0,0);background();pipes.forEach(pipe);birdDraw()}function loop(t){let dt=Math.min((t-last)/1000,.035)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}bestEl.textContent='BEST '+best;reset();requestAnimationFrame(loop)})();</script></body></html>
