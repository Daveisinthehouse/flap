<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#72d7ed"><title>Flap — 16-bit Flight</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72d7ed;touch-action:manipulation;font-family:ui-monospace,monospace}#stage{position:fixed;inset:0;width:100vw;height:100dvh}canvas{width:100%;height:100%;display:block;image-rendering:auto}#hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-weight:bold;text-shadow:2px 3px #42617b}#score{position:absolute;top:18px;left:24px;font-size:clamp(24px,4vw,42px)}#best{position:absolute;top:22px;right:24px;font-size:clamp(13px,2vw,20px)}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;text-shadow:3px 3px #76502e;background:#102c421c}.panel{padding:clamp(18px,4vw,36px);background:#286b83dd;border:4px solid #fff;box-shadow:6px 6px #36546b;max-width:90%}h1{font-size:clamp(36px,8vw,72px);margin:0 0 12px;letter-spacing:3px}p{font-size:clamp(14px,2.3vw,22px);line-height:1.5;margin:8px 0}.hint{font-size:clamp(11px,1.6vw,16px);margin-top:20px}#tap{position:absolute;inset:0;touch-action:manipulation}
</style></head><body><div id="stage"><canvas id="game"></canvas><div id="hud"><div id="score">0</div><div id="best">BEST 0</div></div><div id="overlay"><div class="panel"><h1>FLAP!</h1><p>Tap or press SPACE to flap.<br>Fly through the pipes!</p><p class="hint">TAP / CLICK / SPACE TO START</p></div></div><div id="tap"></div></div>
<script>(()=>{const c=document.querySelector('canvas'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),tap=document.getElementById('tap');let W=960,H=540,dpr=1,state='ready',bird,pipes,score=0,best=+(localStorage.flapBest||0),tick=0,last=0,clouds=[100,420,760,1100];const ground=58,pw=104,gap=232;
function resize(){dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);W=c.width;H=c.height}addEventListener('resize',resize);resize();
function reset(){bird={x:W*.28,y:H*.46,vy:0,rot:0};pipes=[];score=0;tick=0;addPipe(W+100);scoreEl.textContent='0'}function addPipe(x){const top=H*.25+Math.random()*H*.36;pipes.push({x,top,passed:false})}
function show(title,msg,hint){overlay.innerHTML='<div class="panel"><h1>'+title+'</h1><p>'+msg+'</p><p class="hint">'+hint+'</p></div>';overlay.style.display='flex'}function begin(){if(state==='over')reset();state='play';overlay.style.display='none';flap()}function flap(){if(state==='ready'||state==='over'){begin();return}if(state==='play')bird.vy=-H*.66}function act(){if(state!=='play'){begin()}else flap()}tap.addEventListener('pointerdown',e=>{e.preventDefault();act()});addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)act()}});function r(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function background(){r(0,0,W,H,'#72d7ed'); // layered drifting pixel scenery
clouds.forEach((x,i)=>{let xx=(x-tick*(.12+i*.035))%(W+260);if(xx< -180)xx+=W+260;r(xx,H*.18+i%2*H*.1,100,22,'#e8fbf6');r(xx+22,H*.18-18+i%2*H*.1,55,22,'#e8fbf6');r(xx+70,H*.18+8+i%2*H*.1,55,14,'#e8fbf6')});
for(let i=0;i<8;i++){let x=((i*190-tick*.25)%(W+200));r(x,H*.68,140,H*.2,'#9ad995');r(x+25,H*.63,90,H*.08,'#9ad995')}
r(0,H-ground,W,ground,'#e9c879');r(0,H-ground,W,12,'#7acb4c');for(let x=-(tick*1.6%48);x<W;x+=48){r(x,H-ground+18,23,7,'#c79c50');r(x+24,H-ground+38,20,6,'#c79c50')}}
function pipe(p){let bot=p.top+gap;r(p.x,0,pw,p.top-18,'#36a84d');r(p.x-6,p.top-18,pw+12,18,'#66d65e');r(p.x+12,0,10,p.top-18,'#8de77b');r(p.x,bot+18,pw,H-ground-bot-18,'#36a84d');r(p.x-6,bot,pw+12,18,'#66d65e');r(p.x+12,bot+18,10,H-ground-bot-18,'#8de77b');r(p.x+pw-14,0,7,p.top-18,'#288443');r(p.x+pw-14,bot+18,7,H-ground-bot-18,'#288443')}
function birdDraw(){let x=bird.x,y=bird.y;ctx.save();ctx.translate(x,y);ctx.scale(1.55,1.55);ctx.rotate(bird.rot); // crisp 16-bit sprite shapes
r(-23,-15,36,29,'#f5c746');r(-14,-23,22,10,'#f5c746');r(-17,7,20,11,'#dfa332');r(-19,-8,13,15,'#fff0a0');r(5,-10,8,8,'#fff');r(9,-8,4,4,'#26354a');r(12,-2,22,10,'#ef8741');r(20,3,16,5,'#d85c39');r(-10,1,16,10,'#e7a83c');ctx.restore()}
function die(){if(state!=='play')return;state='over';best=Math.max(best,score);localStorage.flapBest=best;bestEl.textContent='BEST '+best;show('GAME OVER','Score '+score+' · Best '+best,'TAP / CLICK / SPACE TO RETRY')}
function update(dt){if(state!=='play')return;tick+=dt*60;bird.vy+=H*1.75*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.5,Math.min(1,bird.vy/(H*.95)));let speed=W*.245;for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+pw<bird.x){p.passed=true;score++;scoreEl.textContent=score}}if(pipes[0]?.x+pw<0)pipes.shift();if(!pipes.length||pipes[pipes.length-1].x<W*.66)addPipe(W+30);if(bird.y+22>H-ground||bird.y-22<0)die();for(const p of pipes)if(bird.x+23>p.x&&bird.x-23<p.x+pw&&(bird.y-18<p.top||bird.y+18>p.top+gap))die()}
function draw(){ctx.setTransform(1,0,0,1,0,0);background();pipes.forEach(pipe);birdDraw()}function loop(t){let dt=Math.min((t-last)/1000,.035)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}bestEl.textContent='BEST '+best;reset();requestAnimationFrame(loop)})();</script></body></html>
