function resize(){dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);W=c.width;H=c.height}addEventListener('resize',resize);resize();
function reset(){bird={x:W*.28,y:H*.46,vy:0,rot:0};pipes=[];stars=[];score=0;tick=0;health=maxHealth;invuln=0;gapPower=0;slowPower=0;openPower=0;addPipe(W+100);scoreEl.textContent='0';updateEnergy()}function updateEnergy(){energyFill.style.width=(health/maxHealth*100)+'%';energyLabel.textContent='HEALTH '+health+' / '+maxHealth}function addPipe(x){let size=Math.min(gap+(gapPower>0?Math.min(H*.22,110):0),H*.7);const minTop=H*.12,maxTop=Math.max(minTop,H-ground-size-H*.12),top=minTop+Math.random()*(maxTop-minTop);pipes.push({x,top,passed:false,gap:size});if(Math.random()<.58){const roll=Math.random(),type=roll<.34?'health':roll<.67?'gap':roll<.92?'slow':'open';stars.push({x:x+pw+80+Math.random()*55,y:top+size*(.38+Math.random()*.24),type,got:false,phase:Math.random()*Math.PI*2})}}
function renderLeaderboard(scores=topScores){topScores=scores;const el=document.getElementById('leaderboard');if(!el)return;el.innerHTML='<b>TOP 5</b>'+(scores.length?'<ol>'+scores.map(s=>'<li>'+escapeHtml(s.name)+' — '+Number(s.score)+'</li>').join('')+'</ol>':'<p>No scores yet</p>')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}async function loadScores(){try{const r=await fetch(leaderboardUrl);if(!r.ok)throw new Error();const d=await r.json();renderLeaderboard(Array.isArray(d.scores)?d.scores:[])}catch{const el=document.getElementById('leaderboard');if(el)el.innerHTML='<b>TOP 5</b><p>Leaderboard unavailable</p>'}}function show(title,msg,hint){overlay.innerHTML='<div class="panel"><h1>'+title+'</h1><p>'+msg+'</p><div class="leaderboard" id="leaderboard"><b>TOP 5</b><p>Loading scores…</p></div><div class="score-form-wrap"></div><p class="hint">'+hint+'</p></div>';overlay.style.display='flex';loadScores()}overlay.addEventListener('submit',async e=>{if(e.target.id!=='scoreForm')return;e.preventDefault();const form=e.target,button=form.querySelector('button'),status=overlay.querySelector('.score-status');button.disabled=true;status.textContent='Saving score…';try{const response=await fetch(leaderboardUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.elements.name.value,score})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not save score');renderLeaderboard(data.scores||[]);status.textContent='Score saved!'}catch(err){status.textContent=err.message||'Could not save score. Try again.';button.disabled=false}});let audioCtx,musicTimer=null,musicStep=0,musicVariant=0,musicOn=true;function getAudioContext(){try{audioCtx=audioCtx||(window.AudioContext?new AudioContext():new webkitAudioContext());if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}function playTone(freq,duration,type='sine',volume=.035){try{const ac=getAudioContext();if(!ac)return;const osc=ac.createOscillator(),gain=ac.createGain(),now=ac.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(ac.destination);osc.start(now);osc.stop(now+duration)}catch{}}function drumKick(volume=.7){const ac=getAudioContext();if(!ac)return;const osc=ac.createOscillator(),gain=ac.createGain(),now=ac.currentTime;osc.type='sine';osc.frequency.setValueAtTime(145,now);osc.frequency.exponentialRampToValueAtTime(46,now+.16);gain.gain.setValueAtTime(volume*.18,now);gain.gain.exponentialRampToValueAtTime(.001,now+.18);osc.connect(gain);gain.connect(ac.destination);osc.start(now);osc.stop(now+.19)}function drumNoise(duration,frequency,volume,kind='highpass'){const ac=getAudioContext();if(!ac)return;const length=Math.max(1,Math.floor(ac.sampleRate*duration)),buffer=ac.createBuffer(1,length,ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=Math.random()*2-1;const source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain(),now=ac.currentTime;source.buffer=buffer;filter.type=kind;filter.frequency.setValueAtTime(frequency,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);source.connect(filter);filter.connect(gain);gain.connect(ac.destination);source.start(now);source.stop(now+duration)}function playBoing(){const ac=getAudioContext();if(!ac)return;const osc=ac.createOscillator(),gain=ac.createGain(),now=ac.currentTime;osc.type='triangle';osc.frequency.setValueAtTime(520,now);osc.frequency.exponentialRampToValueAtTime(175,now+.12);osc.frequency.exponentialRampToValueAtTime(320,now+.23);osc.frequency.exponentialRampToValueAtTime(125,now+.42);gain.gain.setValueAtTime(.065,now);gain.gain.exponentialRampToValueAtTime(.001,now+.43);osc.connect(gain);gain.connect(ac.destination);osc.start(now);osc.stop(now+.44)}function drumSnare(volume=.7){drumNoise(.14,1200,volume*.12);playTone(185,.075,'triangle',volume*.035)}function drumHat(volume=.5,open=false){drumNoise(open?.16:.035,open?5000:7000,volume*(open?.055:.035))}function startMusic(){if(!musicOn)return;getAudioContext();if(musicTimer)return;musicTimer=setInterval(()=>{if(!musicOn||state!=='play')return;const step=musicStep++%32,beat=Math.floor(step/2),bar=Math.floor(beat/4),offbeat=step%2===1;if(step===0)musicStep>32&&(musicStep%32===1)&&(musicVariant=Math.floor(Math.random()*4));const variant=musicVariant||0;if(!offbeat&&beat%4===0)drumKick(.72);else if(!offbeat&&((variant===1&&beat===6)||(variant===2&&beat===10)||(variant===3&&beat===2)))drumKick(.38);if(!offbeat&&(beat%4===1||beat%4===3))drumSnare(.72);if(step>=28&&step<=31&&variant!==0)drumSnare(step===31?.9:.48);if(offbeat){if(Math.random()>.12)drumHat(.4,step===31&&variant===2)}else if(Math.random()>.38)drumHat(.22);if(offbeat&&Math.random()<.09)drumSnare(.25)},250)}function sayVoice(words){try{if(!('speechSynthesis'in window))return;const voices=speechSynthesis.getVoices(),voice=voices.find(v=>/female|samantha|victoria|zira|fiona|karen|moira|tessa|serena|ava|susan/i.test(v.name+' '+v.voiceURI))||voices.find(v=>/^en/i.test(v.lang)),utterance=new SpeechSynthesisUtterance(words);if(voice)utterance.voice=voice;utterance.lang='en-GB';utterance.pitch=1.35;utterance.rate=1.12;utterance.volume=.85;speechSynthesis.cancel();speechSynthesis.speak(utterance)}catch{}}function playStarSound(type){playTone(type==='health'?880:type==='gap'?660:type==='slow'?540:990,.2,'triangle',.045);setTimeout(()=>playTone(type==='open'?1320:1175,.18,'triangle',.035),95)}const musicToggle=document.getElementById('musicToggle');musicToggle.addEventListener('click',()=>{musicOn=!musicOn;musicToggle.textContent='DRUMS: '+(musicOn?'ON':'OFF');musicToggle.setAttribute('aria-pressed',String(musicOn));if(musicOn&&state==='play')startMusic()});function begin(){if(state==='over')reset();state='play';overlay.style.display='none';startMusic();flap()}function flap(){if(state==='ready'||state==='over'){begin();return}if(state==='play'){bird.vy=-H*.55;playBoing()}}function act(){if(state!=='play'){begin()}else flap()}tap.addEventListener('pointerdown',e=>{e.preventDefault();act()});addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,button,select'))return;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)act()}});overlay.addEventListener('click',e=>{if(e.target.id==='restartButton'){e.preventDefault();begin()}});function r(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function background(){

// glowing sunset
ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(W*.78,H*.22,H*.09,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd78c';ctx.beginPath();ctx.arc(W*.78,H*.22,H*.065,0,Math.PI*2);ctx.fill();
// pixel cloud streaks drifting slowly
for(let i=0;i<5;i++){let x=((i*W*.29-tick*.12)%(W+180)+W+180)%(W+180)-90;let y=H*(.15+i%3*.12);r(x,y,110,13,'#fff0e4a8');r(x+20,y-12,55,13,'#fff0e4a8');r(x+75,y+8,45,9,'#fff0e4a8')}
// Countryside parallax: distant blue mountains, rolling green hills,

function ridge(points,color,offset){

 for(let i=0;i<points.length;i++){let x=points[i][0]*W-offset,y=points[i][1]*H;ctx.lineTo(x,y)}

ridge([[0,.65],[.16,.51],[.3,.62],[.46,.46],[.61,.6],[.77,.48],[.91,.61],[1,.53]],'#6c91a7',(tick*.12)%(W*.42));
// Rolling green hills
function hillLayer(color,base,amp,step,speed,seed){
 let off=(tick*speed)%step;

 for(let x=-step;x<=W+step;x+=step/2){let xx=x-off,phase=((Math.floor((x+step)/step)+seed)%5);let yy=H*(base-amp*(phase===0?1:phase===2?.7:.25));ctx.lineTo(xx,yy)}

// Middle distance tree line: individual pine silhouettes on the hills

 let x=i*treeStep-treeOffset,seed=((i*7+31)%5+5)%5,y=H*(.73+seed*.018),h=H*(.09+seed*.012);

// Foreground fields: alternating lush strips, furrows, and hedgerow accents
r(0,H*.82,W,H*.18,'#4f8245');
let fieldOffset=(tick*.95)%96;
for(let x=-96-fieldOffset;x<W+96;x+=96){
 r(x,H*.83,62,H*.17,'#689b4d');
 r(x+62,H*.83,34,H*.17,'#477a42');
 r(x+8,H*.87,3,H*.13,'#8bb65a');r(x+22,H*.87,3,H*.13,'#8bb65a');
}
// Scattered leafy trees closer to the viewer
let closeStep=190,closeOffset=(tick*1.05)%closeStep;
for(let i=-2;i<W/closeStep+3;i++){
 let x=i*closeStep-closeOffset,seed=((i*11+7)%4+4)%4,y=H*.84,h=H*(.12+seed*.012);

 ctx.beginPath();ctx.arc(x+35,y-h*.67,h*.28,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(x+18,y-h*.56,h*.21,0,Math.PI*2);ctx.fill();

}
 // foreground street base and scrolling pavement
r(0,H-ground,W,ground,'#b8a0a0');r(0,H-ground,W,12,'#f4ce8a');r(0,H-ground+12,W,7,'#796b85');for(let x=-(tick*1.6%54);x<W;x+=54){r(x,H-ground+27,28,5,'#e8c5a0');r(x+31,H-ground+42,18,5,'#8e7e91')}
}
function pipe(p){if(openPower>0)return;let bot=p.top+p.gap;let grad=ctx.createLinearGradient(p.x,0,p.x+pw,0);grad.addColorStop(0,'#16864c');grad.addColorStop(.22,'#45d66a');grad.addColorStop(.55,'#8af078');grad.addColorStop(1,'#237d42');r(p.x,0,pw,p.top-20,grad);r(p.x-10,p.top-20,pw+20,20,'#69ed77');r(p.x-10,p.top-20,pw+20,6,'#b0ff8d');r(p.x+15,0,12,p.top-20,'#a5ff9b');r(p.x+pw-18,0,8,p.top-20,'#146d3b');r(p.x,bot+20,pw,H-ground-bot-20,grad);r(p.x-10,bot,pw+20,20,'#69ed77');r(p.x-10,bot,pw+20,6,'#b0ff8d');r(p.x+15,bot+20,12,H-ground-bot-20,'#a5ff9b');r(p.x+pw-18,bot+20,8,H-ground-bot-20,'#146d3b');}
const emmaSprite=new Image(),emmaFrames=[];emmaSprite.src='https://daveisinthehouse.github.io/flap/Animated%20Elf-Eared%20Woman%20Sprite%20Sheet.png';
emmaSprite.onload=()=>{const cellW=emmaSprite.naturalWidth/8,srcY=Math.round(emmaSprite.naturalHeight*.22),srcH=Math.round(emmaSprite.naturalHeight*.54);
 for(let i=0;i<8;i++){let frame=document.createElement('canvas');frame.width=Math.round(cellW);frame.height=srcH;let fctx=frame.getContext('2d');fctx.drawImage(emmaSprite,i*cellW,srcY,cellW,srcH,0,0,frame.width,frame.height);
 let im=fctx.getImageData(0,0,frame.width,frame.height),d=im.data;
 // Strip the neutral gray checkerboard while retaining warm skin, hair, and highlights.

};
function drawStars(){for(const st of stars){if(st.got)continue;let pulse=1+Math.sin(tick*.13+st.phase)*.2,rad=31*pulse;ctx.save();ctx.translate(st.x,st.y);ctx.scale(pulse,pulse);ctx.fillStyle=st.type==='health'?'#ff5c79':st.type==='gap'?'#65e8ff':st.type==='slow'?'#bd8aff':'#ffe45e';ctx.strokeStyle='#fff8c8';ctx.lineWidth=4;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?rad*.48:rad;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(st.type==='health'?'+':st.type==='gap'?'↕':st.type==='slow'?'Ⅱ':'★',0,1);ctx.restore()}}
function birdDraw(){let x=bird.x,y=bird.y;ctx.save();ctx.translate(x,y);ctx.rotate(bird.rot*.45);
 if(emmaFrames.length===8){let frame=Math.floor(tick/5)%8,im=emmaFrames[frame],drawW=im.width*.58,drawH=im.height*.58;ctx.imageSmoothingEnabled=true;ctx.drawImage(im,-drawW/2,-drawH/2,drawW,drawH)}
 else {ctx.scale(2.58,2.58);r(-20,-24,40,10,'#6b3218');r(-25,-17,50,31,'#8b451e');r(-18,-19,36,34,'#f5b18b')}
 ctx.restore()}
function die(){if(state!=='play')return;state='over';playTone(190,.38,'sawtooth',.045);best=Math.max(best,score);localStorage.flapBest=best;bestEl.textContent='BEST '+best;show('GAME OVER','Score '+score+' · Best '+best,'');const box=overlay.querySelector('.score-form-wrap');box.innerHTML='<form id="scoreForm" class="score-form"><input name="name" maxlength="20" autocomplete="nickname" placeholder="Your name" aria-label="Your name" required><button type="submit">SAVE SCORE</button></form><div class="score-status" role="status" aria-live="polite"></div><button type="button" id="restartButton" class="restart-button">RESTART</button>'}
function hit(poleCollision=false){if(invuln>0||state!=='play')return;health=Math.max(0,health-1);invuln=1.1;updateEnergy();if(poleCollision)sayVoice('oof');else playTone(150,.18,'sawtooth',.04);if(health<=0)die()}
function update(dt){if(state!=='play')return;tick+=dt*60;if(invuln>0)invuln-=dt;if(gapPower>0)gapPower-=dt;if(slowPower>0)slowPower-=dt;if(openPower>0)openPower-=dt;bird.vy+=H*1.45*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.5,Math.min(1,bird.vy/(H*.95)));let ramp=1+Math.min(score*.016,1.6),speed=W*.23*ramp*(slowPower>0?.52:1);for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+pw<bird.x){p.passed=true;score++;scoreEl.textContent=score;playTone(740,.12,'sine',.035)}}for(const st of stars)st.x-=speed*dt;if(pipes[0]?.x+pw<0)pipes.shift();if(!pipes.length||pipes[pipes.length-1].x<W*.66)addPipe(W+30);if(bird.y-40<0){hit();bird.y=40;bird.vy=Math.max(Math.abs(bird.vy)*.35,H*.2)}else if(bird.y+40>H-ground){hit();bird.y=H-ground-40;bird.vy=-H*.32}if(openPower<=0)for(const p of pipes){if(bird.x+43>p.x&&bird.x-43<p.x+pw&&(bird.y-36<p.top||bird.y+36>p.top+p.gap)){const upperHit=bird.y-36<p.top;hit(true);if(invuln>0)bird.vy=upperHit?Math.max(Math.abs(bird.vy)*.35,H*.2):-H*.28}}for(const st of stars){if(st.got)continue;if(Math.hypot(st.x-bird.x,st.y-bird.y)<78){st.got=true;playStarSound(st.type);if(st.type==='health'){health=Math.min(maxHealth,health+2);updateEnergy()}else if(st.type==='gap'){gapPower=9;for(const p of pipes)p.gap=Math.min(H*.7,p.gap+Math.min(H*.22,110))}else if(st.type==='slow'){slowPower=7}else if(st.type==='open'){openPower=8}}}stars=stars.filter(st=>st.x>-80&&!st.got)}
function draw(){ctx.setTransform(1,0,0,1,0,0);background();pipes.forEach(pipe);drawStars();birdDraw()}function loop(t){let dt=Math.min((t-last)/1000,.035)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}bestEl.textContent='BEST '+best;reset();requestAnimationFrame(loop)})();</script></body></html>
